[package]
name = "clonebox"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
tonic = "*"
prost = "0.14"
tonic-prost = "*"
tokio = { version = "1.0", features = ["macros", "net", "process", "rt-multi-thread"] }
clonebox-core = { path = "../clonebox-core" }

[build-dependencies]
tonic-prost-build = "*"
