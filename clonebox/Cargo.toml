[package]
name = "clonebox"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "clonebox is a cli RPC client that communicates with cloneboxd (daemon)"
authors = ["pan-ic <dev@paan.fr>"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive"] }
tonic = "*"
prost = "0.14"
tonic-prost = "*"
tokio = { version = "1.0", features = ["macros", "net", "process", "rt-multi-thread"] }
clonebox-core = { path = "../clonebox-core" }

[build-dependencies]
tonic-prost-build = "*"

[package.metadata.cargo-machete]
ignored = ["prost", "tonic-prost"]
